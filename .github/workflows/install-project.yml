name: Install Circuit City project

on:
  push:
    branches: [main]
    paths:
      - '.upload/part-*.txt'
      - '.github/workflows/install-project.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild Circuit City project
        shell: bash
        run: |
          cat .upload/part-*.txt | base64 --decode > project.zip
          rm -rf _deploy
          mkdir _deploy
          unzip -q project.zip -d _deploy
          cp -a _deploy/circuit-city/. .
          rm -rf .upload project.zip _deploy
          rm -f .github/workflows/install-project.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit deployed project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Deploy Circuit City"
            git push
          fi
